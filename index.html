<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VaxFile</title>
  <meta name="description" content="VaxFile helps expat families track their children's vaccinations across 9 countries. One app, every official schedule. Free on iOS and Android.">
  <link rel="canonical" href="https://www.vaxfile.app/en/">
  <link rel="alternate" hreflang="en" href="https://www.vaxfile.app/en/">
  <link rel="alternate" hreflang="de" href="https://www.vaxfile.app/de/">
  <link rel="alternate" hreflang="es" href="https://www.vaxfile.app/es/">
  <link rel="alternate" hreflang="nl" href="https://www.vaxfile.app/nl/">
  <link rel="alternate" hreflang="x-default" href="https://www.vaxfile.app/en/">
  <script>
    (function() {
      var lang = navigator.language || navigator.userLanguage || 'en';
      var saved = sessionStorage.getItem('vaxfile-lang');
      var target = saved || (lang.startsWith('de') ? 'de' : lang.startsWith('nl') ? 'nl' : lang.startsWith('es') ? 'es' : 'en');
      if (!saved) sessionStorage.setItem('vaxfile-lang', target);
      window.location.replace('/' + target + '/');
    })();
  </script>
</head>
<body>
<noscript>
  <p><a href="/en/">English</a> · <a href="/de/">Deutsch</a> · <a href="/nl/">Nederlands</a> · <a href="/es/">Español</a></p>
</noscript></body>
</html>
